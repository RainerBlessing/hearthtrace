[project]
name = "hs-tracker"
version = "0.1.0"
description = "Native Linux Hearthstone deck tracker"
requires-python = ">=3.11"
dependencies = [
    "hslog>=1.20",
    "hearthstone>=9.20",
    "hearthstone_data",
    "PyGObject>=3.58",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "mypy>=2.3",
    "radon>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/hs_tracker"]
omit = ["src/hs_tracker/app.py", "src/hs_tracker/ui.py"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["hs_tracker"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
