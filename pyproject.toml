[project]
name = "hearthtrace"
version = "0.1.0"
description = "Native Linux Hearthstone tracker and replay analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

authors = [
    { name = "Rainer Blessing" }
]

keywords = [
    "hearthstone",
    "linux",
    "tracker",
    "replay",
    "power-log",
]

dependencies = [
    "hslog>=1.20",
    "hearthstone>=9.20",
    "hearthstone_data",
    "PyGObject>=3.58",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "mypy>=2.3",
    "radon>=6.0",
]

[project.scripts]
hearthtrace = "hearthtrace.app:main"

[project.urls]
Homepage = "https://github.com/rainerblessing/hearthtrace"
Repository = "https://github.com/rainerblessing/hearthtrace"
Issues = "https://github.com/rainerblessing/hearthtrace/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/hearthtrace"]
omit = [
    "src/hearthtrace/app.py",
    "src/hearthtrace/ui.py",
]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["hearthtrace"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
